<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 12 295 78" width="100%" height="100%">
  <!-- Minimalist Shield Emblem (Left) -->
  <g>
    <!-- Shield Outline -->
    <path d="M50 16 L80 26 V52 C80 69 68 82 50 87 C32 82 20 69 20 52 V26 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    
    <!-- Stylized T-Bar & Nodes -->
    <path d="M35 36 H65" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <circle cx="35" cy="36" r="3.5" fill="#ffffff" />
    <circle cx="65" cy="36" r="3.5" fill="#ffffff" />
    
    <!-- Top Connector Node -->
    <circle cx="50" cy="27" r="3.5" fill="#ffffff" />
    <line x1="50" y1="27" x2="50" y2="40" stroke="#ffffff" stroke-width="2" />

    <!-- Server Racks / Skyscraper Vertical Bars -->
    <rect x="40" y="46" width="5" height="16" rx="2.5" fill="#ffffff" />
    <rect x="47.5" y="42" width="5" height="26" rx="2.5" fill="#ffffff" />
    <rect x="55" y="51" width="5" height="11" rx="2.5" fill="#ffffff" />
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(95, 0)">
    <!-- Brand Title -->
    <text x="0" y="44" 
          font-family="'Outfit', 'Segoe UI', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="34" 
          fill="#ffffff" 
          letter-spacing="0.04em">TISMO</text>
    
    <!-- Subtitle 1 -->
    <text x="0" y="66" 
          font-family="'Outfit', 'Segoe UI', -apple-system, sans-serif" 
          font-weight="700" 
          font-size="12" 
          fill="#ffffff" 
          letter-spacing="0.08em">SISTEMA DE GESTIÓN TI</text>
    
    <!-- Subtitle 2 -->
    <text x="0" y="82" 
          font-family="'Segoe UI', -apple-system, sans-serif" 
          font-weight="500" 
          font-size="9" 
          fill="#a1a1aa" 
          letter-spacing="0.04em">SHOPPING MANAGEMENT OPERADORA</text>
  </g>
</svg>
